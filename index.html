<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>For My Little Sister — 06 October 💗</title>
<style>
:root{--pink:#ff5f9e;--rose:#ff8fbd;--purple:#7c5cff;--ink:#291b35;--cream:#fff7fb;--gold:#ffd66b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);background:#160f27;overflow-x:hidden}.app{min-height:100vh;background:linear-gradient(180deg,#160f27,#25133d 45%,#fff7fb 100%)}button{font:inherit;cursor:pointer}.screen{min-height:100vh;padding:42px 18px;display:none;place-items:center;position:relative;overflow:hidden}.screen.active{display:grid}.card{width:min(900px,94vw);background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.5);border-radius:30px;padding:34px;box-shadow:0 25px 80px rgba(0,0,0,.25);text-align:center;position:relative;z-index:2}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;color:var(--pink);font-weight:800}.title{font-size:clamp(2.5rem,9vw,6.5rem);line-height:.9;margin:14px 0;background:linear-gradient(90deg,#ff5f9e,#8d67ff,#ff8b72);-webkit-background-clip:text;color:transparent}.sub{font-size:clamp(1rem,2.6vw,1.35rem);line-height:1.7}.btn{border:0;border-radius:999px;padding:14px 22px;margin:7px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;font-weight:800;box-shadow:0 10px 25px #ff5f9e44;transition:.2s}.btn:hover{transform:translateY(-3px) scale(1.02)}.ghost{background:#fff;color:var(--ink);border:2px solid #f0d5e4}.stars,.hearts{position:absolute;inset:0;pointer-events:none}.star{position:absolute;color:#fff;opacity:.75;animation:twinkle 2.5s infinite alternate}.heart{position:absolute;animation:float 6s linear infinite;color:#ff79ad;opacity:.55}@keyframes twinkle{to{opacity:.15;transform:scale(.6)}}@keyframes float{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.door-wrap{display:flex;gap:10px;justify-content:center;align-items:center;margin:25px 0}.door{width:180px;height:270px;border-radius:12px 12px 6px 6px;background:linear-gradient(90deg,#6b3e2c,#9e6043);box-shadow:inset 0 0 0 7px #4a2a20,0 20px 50px #0006;position:relative;transition:1.2s}.door:before{content:'06 OCT';position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);color:#ffe7b1;font-weight:900;letter-spacing:.15em}.knob{position:absolute;right:20px;top:52%;width:12px;height:12px;border-radius:50%;background:#ffd66b}.door.open{transform:perspective(700px) rotateY(-70deg);transform-origin:left}.input{padding:14px 18px;border:2px solid #ead4e2;border-radius:15px;text-align:center;font-size:1.1rem;outline:none}.error{color:#d83c69;font-weight:700;min-height:25px}.balloons{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:24px}.balloon{width:74px;height:92px;border-radius:50% 50% 48% 48%;border:0;background:var(--c);position:relative;box-shadow:inset -8px -10px 0 #0001;animation:bob 2.2s infinite ease-in-out}.balloon:after{content:'';position:absolute;bottom:-24px;left:50%;height:25px;border-left:2px solid #777}.balloon.popped{animation:pop .3s forwards}@keyframes bob{50%{transform:translateY(-12px)}}@keyframes pop{to{transform:scale(1.7);opacity:0}}.spark{position:fixed;pointer-events:none;font-size:24px;animation:burst .9s forwards;z-index:20}@keyframes burst{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}
.puzzle{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:430px;margin:22px auto}.tile{aspect-ratio:1;border:0;border-radius:18px;background:#ffe0ed;color:#9c4770;font-size:2rem;font-weight:900}.tile.selected{outline:4px solid var(--purple)}.quiz{max-width:650px;margin:auto}.option{display:block;width:100%;margin:10px 0;padding:15px;border-radius:15px;border:2px solid #f1dce8;background:#fff;text-align:left;font-weight:700}.option.correct{background:#d9f9e4;border-color:#54bb79}.option.wrong{background:#ffe0e8;border-color:#ff6f8f}.progress{height:10px;background:#f3dfeb;border-radius:99px;overflow:hidden;margin:18px 0}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple));width:0}.boxes{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.giftbox{width:130px;height:130px;border:0;border-radius:22px;background:linear-gradient(145deg,#ff93bc,#a875ff);color:#fff;font-size:2.8rem;box-shadow:0 15px 30px #8d67ff33;transition:.3s}.giftbox:hover{transform:rotate(-4deg) scale(1.05)}.message{min-height:100px;display:grid;place-items:center;padding:20px;border-radius:22px;background:#fff3f8;font-size:1.25rem;line-height:1.6}.scratch{height:210px;max-width:520px;margin:20px auto;border-radius:28px;background:repeating-linear-gradient(135deg,#d9d9df 0 12px,#eeeef3 12px 24px);display:grid;place-items:center;font-weight:900;color:#6b6872;position:relative;overflow:hidden;cursor:pointer}.scratch .secret{position:absolute;inset:0;display:grid;place-items:center;background:#fff1f7;color:#d84c83;font-size:1.5rem;padding:25px;opacity:0;transition:.5s}.scratch.revealed .secret{opacity:1}.count{font-size:clamp(2rem,8vw,5rem);font-weight:900;color:var(--pink)}.animals{font-size:4rem;display:flex;justify-content:center;gap:20px;animation:wiggle 1.5s infinite alternate}.animals span{display:inline-block}@keyframes wiggle{to{transform:translateY(-8px) rotate(3deg)}}.timeline{display:grid;gap:12px;text-align:left;margin:25px auto;max-width:650px}.day{padding:17px 20px;border-radius:18px;background:#fff;border-left:6px solid var(--pink);box-shadow:0 8px 20px #8d67ff12}.bouquet{font-size:6rem;animation:bloom 2s ease-out forwards}@keyframes bloom{from{transform:scale(.1) rotate(-20deg);filter:blur(8px)}to{transform:scale(1) rotate(0);filter:none}}.letter{text-align:left;line-height:1.9;font-size:1.08rem;background:#fffdf7;padding:28px;border-radius:22px;border:1px solid #f1dfbd}.signature{font-size:1.5rem;font-weight:900;color:#8d67ff}.small{font-size:.9rem;opacity:.7}.confetti{position:fixed;top:-20px;font-size:20px;animation:fall 3s linear forwards;z-index:30}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@media(max-width:600px){.card{padding:24px 17px;border-radius:24px}.door{width:140px;height:220px}.puzzle{max-width:330px}}
</style></head>
<body><main class="app" id="app"></main>
<script>
const app=document.getElementById('app');
const sections=[
`<section class="screen active" id="s0"><div class="stars" id="stars"></div><div class="hearts" id="hearts"></div><div class="card" style="background:rgba(255,255,255,.96)"><div class="eyebrow">A tiny universe made for one special girl</div><div class="title">Hey, Little Sister 💗</div><p class="sub">There is a little surprise waiting behind this door.<br><b>But only your birthday can open it.</b></p><div class="door-wrap"><div class="door" id="door"><div class="knob"></div></div></div><input class="input" id="dob" type="text" inputmode="numeric" placeholder="Enter your birthday: DDMMYYYY" maxlength="8"><div class="error" id="doorErr"></div><button class="btn" onclick="openDoor()">Open the birthday door ✨</button><p class="small">Hint: the day this beautiful soul arrived in the world.</p></div></section>`,
`<section class="screen" id="s1"><div class="stars" id="stars1"></div><div class="card"><div class="eyebrow">Chapter 01 · Birthday sky</div><h1>POP THE BALLOONS 🎈</h1><p class="sub">Every balloon is hiding a tiny piece of my wish. Pop them all.</p><div class="balloons" id="balloons"></div><div class="message" id="balloonMsg">There are wishes here that words alone cannot carry…</div><button class="btn" onclick="go(2)">Continue the journey →</button></div></section>`,
`<section class="screen" id="s2"><div class="card"><div class="eyebrow">Chapter 02 · A little challenge</div><h1>THE 3×3 HEART PUZZLE 🧩</h1><p>Arrange the numbers from 1 to 9. Tap two tiles to swap them.</p><div class="puzzle" id="puzzle"></div><div class="message" id="puzzleMsg">A sister who can solve this can definitely handle my dramatic brotherhood too. 😭😂</div></div></section>`,
`<section class="screen" id="s3"><div class="card"><div class="eyebrow">Puzzle complete ✨</div><div class="bouquet">💐</div><h1>YOU DID IT!</h1><p class="sub">Okay… that deserves another birthday wish.</p><div class="message">If distance were a wall, our bond would be the window through it. You may be far from my hostel, but you have never been far from my heart.</div><button class="btn" onclick="go(4)">Unlock the quiz →</button></div></section>`,
`<section class="screen" id="s4"><div class="card"><div class="eyebrow">Chapter 03 · Sister test</div><h1>HOW WELL DO YOU KNOW YOUR BROTHER? 😭</h1><div class="progress"><i id="quizbar"></i></div><div class="quiz" id="quiz"></div></div></section>`,
`<section class="screen" id="s5"><div class="card"><div class="eyebrow">Chapter 04 · The main gift</div><h1>CHOOSE ONE GIFT BOX 🎁</h1><p class="sub">Three boxes. One is hiding the biggest message.</p><div class="boxes"><button class="giftbox" onclick="gift(0)">🎁</button><button class="giftbox" onclick="gift(1)">🎀</button><button class="giftbox" onclick="gift(2)">💝</button></div><div class="message" id="giftMsg">Choose carefully… although, honestly, all three are from the same idiot brother. 😂</div></div></section>`,
`<section class="screen" id="s6"><div class="card"><div class="eyebrow">Chapter 05 · Days, distance & memories</div><h1>THE DAYS BETWEEN US 🌙</h1><div class="timeline"><div class="day"><b>Every morning</b><br>I hope you wake up with a reason to smile.</div><div class="day"><b>Every ordinary day</b><br>I remember that some people make life feel warmer simply by existing.</div><div class="day"><b>Every festival</b><br>Distance can cancel a meeting. It cannot cancel a bond.</div><div class="day"><b>Every birthday</b><br>I get one more chance to tell you how important you are.</div><div class="day"><b>Every future day</b><br>No matter how much life changes, I hope this little bond remains one of your safe places.</div></div><button class="btn" onclick="go(7)">One final secret →</button></div></section>`,
`<section class="screen" id="s7"><div class="card"><div class="eyebrow">Chapter 06 · Scratch the screen</div><h1>DON'T TRUST THIS BORING CARD 😌</h1><p>Tap anywhere on it. Keep tapping.</p><div class="scratch" id="scratch" onclick="scratchIt(event)"><span>SCRATCH / TAP ME 💗</span><div class="secret">Surprise! 🎉 You are officially stuck with an overprotective, slightly dramatic, forever-supportive brother. 💗</div></div><div class="animals">🐻 🐰 🐼 🐣 🐨</div><button class="btn" onclick="go(8)">Meet the candle-blowing committee →</button></div></section>`,
`<section class="screen" id="s8"><div class="card"><div class="eyebrow">Chapter 07 · Emergency cuteness department</div><h1>THE OFFICIAL BIRTHDAY COMMITTEE 🐻</h1><div class="animals"><span>🐻</span><span>🐰</span><span>🐼</span><span>🐣</span></div><p class="sub">They were asked to blow out your candle.</p><div style="font-size:6rem">🧁💨</div><p>🐻: “I blew.”<br>🐰: “I blew harder.”<br>🐼: “I ate the cake.”<br>🐣: “I forgot the birthday.”</p><button class="btn" onclick="go(9)">Okay, serious mode now 💗</button></div></section>`,
`<section class="screen" id="s9"><div class="card"><div class="eyebrow">Chapter 08 · The part I actually mean</div><h1>FROM YOUR BROTHER, WITH ALL MY HEART</h1><div class="letter"><p>Dear little sister,</p><p>Maybe we were not connected by the same blood. Maybe we do not have the same home, the same surname, or even the same place to celebrate your birthday.</p><p>But somewhere between conversations, secrets, jokes, little fights, care, and all those moments we shared, you stopped being “someone I know.” You became my sister.</p><p><b>Blood made us strangers… but the heart made us siblings.</b></p><p>Some relationships are written by blood; ours was written by hearts.</p><p>You were never “just” an unblooded sister to me. You became my little sister the moment our hearts accepted it.</p><p><b>Real sister by blood? No. Real sister by bond? Absolutely.</b></p><p>And if you ever feel that distance has made this bond smaller, remember this: distance measures kilometres, not attachment.</p><p>Today, I cannot walk to your door and hand you a gift. I cannot sit beside your birthday cake. I cannot annoy you in person. So I built a tiny place on the internet where my wishes can reach you instead.</p><p>Happy Birthday, little one. 🎂💗<br>May you laugh loudly, dream fearlessly, stay kind, and always know that somewhere there is a brother who genuinely wants to see you happy.</p><p class="signature">Happy Birthday, my little sister. 🌷<br>— Your brother, always.</p></div><button class="btn" onclick="finale()">Open the last surprise ✨</button></div></section>`,
`<section class="screen" id="s10"><div class="stars" id="stars10"></div><div class="card"><div class="bouquet">💐</div><div class="eyebrow">Final chapter · 06 October</div><div class="title">HAPPY BIRTHDAY! 🎂</div><p class="sub">For the girl who was never my sister by blood…<br><b>but became my sister by heart.</b></p><div class="count" id="count">∞</div><p>Some gifts are opened once.<br>This one is meant to be remembered.</p><button class="btn" onclick="replay()">Replay the whole surprise 🔁</button></div></section>`
];
app.innerHTML=sections.join('');
function go(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('s'+n).classList.add('active');window.scrollTo(0,0);if(n===1)makeBalloons();if(n===2)makePuzzle();if(n===4)startQuiz();ambient(n)}
function ambient(n){const host=document.getElementById('s'+n);if(!host)return;const layer=host.querySelector('.stars');if(layer){layer.innerHTML='';for(let i=0;i<55;i++){let e=document.createElement('span');e.className='star';e.textContent='✦';e.style.left=Math.random()*100+'%';e.style.top=Math.random()*100+'%';e.style.fontSize=(8+Math.random()*16)+'px';e.style.animationDelay=Math.random()*3+'s';layer.appendChild(e)}}}
ambient(0);ambient(10);
function openDoor(){let v=document.getElementById('dob').value.replace(/\D/g,'');if(v==='06102010'){document.getElementById('door').classList.add('open');setTimeout(()=>go(1),900)}else document.getElementById('doorErr').textContent='The birthday door only opens for the right birthday. 💗 Hint: 06 October 2010';}
function burst(x,y){for(let i=0;i<18;i++){let e=document.createElement('div');e.className='spark';e.textContent=['✨','💗','⭐','🌸'][i%4];e.style.left=x+'px';e.style.top=y+'px';e.style.setProperty('--x',(Math.random()*240-120)+'px');e.style.setProperty('--y',(Math.random()*240-120)+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),900)}}
const wishes=['May your smile always find its way back to you. 💗','May your dreams become bigger than your fears. ✨','May life give you people who protect your heart. 🌷','May you always remember how loved you are. 🫶','And yes… your annoying brother is still here. 😂'];
function makeBalloons(){let b=document.getElementById('balloons');if(b.children.length)return;for(let i=0;i<5;i++){let x=document.createElement('button');x.className='balloon';x.style.setProperty('--c',['#ff719f','#8d78ff','#ffd66b','#63d8ca','#ff9b6a'][i]);x.onclick=e=>{if(x.classList.contains('popped'))return;x.classList.add('popped');burst(e.clientX,e.clientY);document.getElementById('balloonMsg').textContent=wishes[i];if([...b.children].every(a=>a.classList.contains('popped')))setTimeout(()=>document.getElementById('balloonMsg').textContent+='  ✨ You found every wish!',500)};b.appendChild(x)}}
let arr=[1,2,3,4,5,6,7,8,9],sel=null;function makePuzzle(){arr=[1,2,3,4,5,6,7,8,9].sort(()=>Math.random()-.5);sel=null;drawPuzzle()}function drawPuzzle(){let p=document.getElementById('puzzle');p.innerHTML='';arr.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(sel===i?' selected':'');b.textContent=v;b.onclick=()=>{if(sel===null){sel=i;drawPuzzle()}else{[arr[sel],arr[i]]=[arr[i],arr[sel]];sel=null;drawPuzzle();checkPuzzle()}};p.appendChild(b)})}function checkPuzzle(){if(arr.every((v,i)=>v===i+1)){document.getElementById('puzzleMsg').innerHTML='<b>Puzzle solved! 🎉</b> You unlocked the next chapter.';setTimeout(()=>go(3),900)}}
const qs=[['What date is this birthday journey made for?',['06 October','26 January','15 August','14 November'],0],['What makes this sister–brother bond special?',['Only distance','Shared heart and attachment','A family surname','A school uniform'],1],['What should a good brother always protect?',['Only secrets','His sister’s happiness and dignity','His phone','His snacks'],1],['What is the secret ingredient in this website?',['Wi‑Fi','Blood','Love + memories + madness','Chocolate'],2]];let qi=0,score=0;function startQuiz(){qi=0;score=0;showQ()}function showQ(){let q=qs[qi],box=document.getElementById('quiz');document.getElementById('quizbar').style.width=(qi/qs.length*100)+'%';box.innerHTML='<h2>'+q[0]+'</h2>'+q[1].map((o,i)=>`<button class="option" onclick="answer(${i})">${o}</button>`).join('')}function answer(i){let q=qs[qi],ops=[...document.querySelectorAll('.option')];ops.forEach((x,j)=>{x.disabled=true;if(j===q[2])x.classList.add('correct');else if(j===i)x.classList.add('wrong')});if(i===q[2])score++;setTimeout(()=>{qi++;if(qi<qs.length)showQ();else{document.getElementById('quiz').innerHTML='<h2>Quiz complete! 🎉</h2><div class="message">You got '+score+'/'+qs.length+'. Either way, you still get the gift because this brother has no cancellation policy. 😂💗</div><button class="btn" onclick="go(5)">Open gift boxes 🎁</button>';document.getElementById('quizbar').style.width='100%' }},700)}
function gift(i){let msgs=['This box contains: one lifetime supply of “Take care of yourself, okay?” 💗','This box contains: emergency brother support — 24/7, no subscription required. 🫶','This box contains the truth: you are not my sister by blood, but you are absolutely my sister by heart. Happy Birthday. 💐'];document.getElementById('giftMsg').innerHTML='<b>'+msgs[i]+'</b>'+(i===2?' <br><br>And now… there is one final letter waiting.':'');if(i===2)setTimeout(()=>go(6),1200)}
let taps=0;function scratchIt(e){taps++;burst(e.clientX,e.clientY);document.getElementById('scratch').classList.add('revealed');if(taps>4)document.getElementById('scratch').querySelector('span').textContent='Okay okay, you found it! 😂'}
function finale(){for(let i=0;i<100;i++){let e=document.createElement('div');e.className='confetti';e.textContent=['🎉','💗','✨','🌸','⭐','🎈'][i%6];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*1.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),4500)}go(10)}function replay(){location.reload()}
</script></body></html>
